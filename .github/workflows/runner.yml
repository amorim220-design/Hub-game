name: Build runner APK (Winlator base)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "runner/**"
      - ".github/workflows/runner.yml"

jobs:
  build:
    name: Build and sign the runner APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build the runner APK
        env:
          # A chave e versionada em runner/keystore/ para que o APK de cada
          # build tenha a MESMA assinatura. Sem isso o aparelho recusa a
          # atualizacao por cima (INSTALL_FAILED_UPDATE_INCOMPATIBLE) e o
          # usuario teria que desinstalar - o que apaga o container e os jogos.
          KEYSTORE_PATH: ${{ github.workspace }}/runner/keystore/runner.keystore
          STORE_PASSWORD: runner
          KEY_ALIAS: runner
          KEY_PASSWORD: runner
        run: |
          set +e
          ./runner/build.sh 2>&1 | tee runner-build.log
          status=${PIPESTATUS[0]}
          {
            echo "### Runner build output"
            echo '```'
            tail -n 250 runner-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # O GitHub limita a 10 anotacoes por passo: cada bloco de log vai em
          # uma unica anotacao (com %0A no lugar das quebras de linha).
          PAYLOAD=$(grep -nE "Killed|OutOfMemory|No space left|FAILURE|error:|Exception|Caused by|BUILD (SUCCESSFUL|FAILED)|error " runner-build.log | tail -n 40 | sed 's/%/%25/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')
          echo "::error title=Runner::${PAYLOAD}"
          TAIL=$(tail -n 25 runner-build.log | sed 's/%/%25/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')
          echo "::error title=Runner-tail::${TAIL}"
          exit $status

      - name: Upload the runner APK
        uses: actions/upload-artifact@v4
        with:
          name: hubgame-runner-arm64
          path: runner/dist/*.apk
          retention-days: 14
          if-no-files-found: error

      # Release publica: o APK fica com um link direto (releases de repo
      # publico baixam sem login, ao contrario dos artefatos de Actions).
      - name: Publish the APK as a release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if gh release view runner-latest >/dev/null 2>&1; then
            gh release upload runner-latest runner/dist/*.apk --clobber
          else
            gh release create runner-latest runner/dist/*.apk \
              --title "Runner (base Winlator)" \
              --notes "APK unico com Wine + Box64 + DXVK + Turnip para arm64-v8a. Build: workflow 'Build runner APK (Winlator base)'."
          fi
          gh release view runner-latest --json url,assets --jq '{url: .url, assets: [.assets[] | {name: .name, size: .size}]}'

      - name: Upload the build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-build-log
          path: runner-build.log
          retention-days: 7
          if-no-files-found: warn
