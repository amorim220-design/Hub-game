name: Build APK (arm64-v8a)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android NDK (r27c) for the CMake build
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install the SDK packages the build needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      # DXVK is NOT vendored in this repository (it is not ours to ship, and the
      # upstream project does not target Android). It reaches the app as the
      # user's "runtime package" (see README, section 3). If a prebuilt
      # arm64-v8a libdxvk.so is made available through the DXVK_PREBUILT_URL
      # repository variable, it is downloaded and packaged with the APK.
      - name: "Optional: fetch prebuilt DXVK for arm64-v8a"
        env:
          DXVK_PREBUILT_URL: ${{ vars.DXVK_PREBUILT_URL }}
        run: |
          if [ -z "$DXVK_PREBUILT_URL" ]; then
            echo "DXVK_PREBUILT_URL not set: building the shell without a bundled DXVK (expected)."
            exit 0
          fi
          mkdir -p third_party/dxvk-prebuilt/lib/arm64-v8a
          curl -sSL "$DXVK_PREBUILT_URL" -o /tmp/dxvk.tar.gz
          tar -xzf /tmp/dxvk.tar.gz -C third_party/dxvk-prebuilt
          find third_party/dxvk-prebuilt -name "*.so" -exec mv {} third_party/dxvk-prebuilt/lib/arm64-v8a/ \;
          ls -la third_party/dxvk-prebuilt/lib/arm64-v8a/

      - name: Create the debug keystore (used by the debug build type)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create the release keystore (CI placeholder)
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Upload Key,O=Android,C=US"
          fi

      - name: Unit tests (Robolectric)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug and release APKs
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: upload
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          {
            echo "### Gradle build output"
            echo '```'
            tail -n 250 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the interesting lines as annotations, so they are visible
          # from the API and in the checks tab without downloading the log.
          grep -E "(^e: |error:|FAILURE:|What went wrong|> Task .* FAILED|Caused by:|A problem occurred|CMake Error|ndk-build)" build.log \
            | head -60 \
            | while IFS= read -r line; do
                echo "::error title=Gradle::${line}"
              done
          exit $status

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VulkanCompatShell-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release APK (already signed by AGP)
        uses: actions/upload-artifact@v4
        with:
          name: VulkanCompatShell-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
